[project]
name = "cyclicpeptide"
version = "1.3.0"
description = "A python package for cyclic peptides drug design"
readme = "README.md"
authors = [{ name = "Willow", email = "willow.yang.b@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10,<3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "ipython>=8.18.1",
    "matplotlib==3.8",
    "networkx==3.1",
    "numpy==1.24.4",
    "pandas==2.0.3",
    "rdkit==2023.9.5",
    "scipy==1.13.0",
    "setuptools>=83",
]

[project.urls]
Homepage = "https://github.com/Willow0316/cyclicpeptide/tree/master"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cyclicpeptide"]
force-include = { "states" = "states" }

[tool.hatch.build.targets.sdist]
include = ["cyclicpeptide", "states", "README.md"]
